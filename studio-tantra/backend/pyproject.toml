[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-tantra-backend"
version = "0.1.0"
description = "LangGraph orchestration engine for Studio Tantra"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.0.30",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.1.0",
    "supabase>=2.0.0",
    "boto3>=1.28.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "pydantic-core>=2.0.0",
    "invoke>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.9.0",
    "ruff>=0.10.0",
    "mypy>=1.5.0",
]
